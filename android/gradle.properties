org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# Kotlin daemon configuration
kotlin.daemon.jvm.options=-Xmx2048m
kotlin.daemon.enabled=true
kotlin.daemon.verbose=false
kotlin.daemon.debug=false
kotlin.daemon.port=0

# Gradle daemon configuration
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# Fix for path conflicts
org.gradle.caching=false
org.gradle.unsafe.configuration-cache=false
org.gradle.unsafe.isolated-projects=false
org.gradle.unsafe.configuration-cache-problems=warn

# Additional fixes for path conflicts
android.enableJetifier=true
android.useAndroidX=true
android.enableR8.fullMode=false
android.enableDexingArtifactTransform.desugaring=false